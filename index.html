<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
  <title>PS2 Jungle DrumPad</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap');

    * {
      box-sizing: border-box;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #050814;
      color: #00f0ff;
      font-family: 'Chakra Petch', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* PANTALLA DE INICIO */
    #startScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle, #101835 0%, #03050d 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      text-shadow: 0 0 10px #00f0ff;
    }

    #startScreen h1 {
      font-size: 2.2rem;
      letter-spacing: 3px;
      margin-bottom: 5px;
      color: #ffffff;
      text-transform: uppercase;
    }

    #startScreen p {
      font-size: 0.9rem;
      color: #7080b0;
      margin-bottom: 30px;
    }

    .play-btn {
      background: linear-gradient(135deg, #00f0ff, #7000ff);
      border: 2px solid #ffffff;
      border-radius: 50px;
      color: #ffffff;
      padding: 18px 45px;
      font-size: 1.5rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
      cursor: pointer;
    }

    .play-btn:active {
      transform: scale(0.95);
    }

    /* CONTENEDOR PRINCIPAL PS2 */
    #app {
      display: none;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      padding: 12px;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(180deg, #0c1026 0%, #050714 100%);
      box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.2);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(0, 240, 255, 0.05);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 6px;
    }

    .header .logo {
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 1.5px;
      color: #ffffff;
    }

    /* BOTÓN MUTE */
    .mute-btn {
      background: rgba(255, 0, 85, 0.15);
      border: 1px solid #ff0055;
      color: #ff0055;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 0 6px rgba(255, 0, 85, 0.3);
      transition: all 0.15s ease;
    }

    .mute-btn:active {
      transform: scale(0.92);
    }

    .mute-btn.muted {
      background: #ff0055;
      color: #ffffff;
      box-shadow: 0 0 12px #ff0055;
    }

    .header .status {
      font-size: 0.7rem;
      color: #00ff66;
      text-shadow: 0 0 5px #00ff66;
    }

    /* GRID DE 12 PADS */
    .pad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 8px;
      flex-grow: 1;
      margin-top: 10px;
    }

    .pad {
      background: linear-gradient(145deg, #161d3a, #0b0f24);
      border: 1.5px solid #2a386e;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #a0b0e0;
      font-size: 0.85rem;
      font-weight: bold;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    .pad.active {
      border-color: #00f0ff;
      box-shadow: 0 0 15px #00f0ff;
      background: #1a295c;
      color: #ffffff;
    }

    .pad.glitch-pad {
      background: linear-gradient(145deg, #3a1628, #240b17);
      border-color: #ff0055;
      color: #ffa0c0;
    }

    .pad.glitch-pad.active {
      border-color: #ff0055;
      box-shadow: 0 0 15px #ff0055;
      background: #5c1a3a;
      color: #ffffff;
    }

    .pad span {
      pointer-events: none;
      text-transform: uppercase;
      font-size: 0.75rem;
    }

    .pad .indicator {
      position: absolute;
      bottom: 4px;
      font-size: 0.55rem;
      color: #00f0ff;
      opacity: 0.75;
    }

    .pad.glitch-pad .indicator {
      color: #ff0055;
    }
  </style>
</head>
<body>

  <!-- PANTALLA DE INICIO -->
  <div id="startScreen">
    <h1>PS2 JUNGLE PAD</h1>
    <p>TAP TO START SOUND SYSTEM</p>
    <button class="play-btn" id="playBtn">PLAY</button>
  </div>

  <!-- INTERFAZ PRINCIPAL -->
  <div id="app">
    <div class="header">
      <div class="logo">PS2 // BREAKS</div>
      <button id="muteBtn" class="mute-btn">MUTE</button>
      <div class="status" id="statusIndicator">● DRUM LOOP ACTIVE</div>
    </div>

    <div class="pad-grid">
      <!-- 9 SAMPLES PRINCIPALES -->
      <div class="pad" data-sound="sample1"><span>SMP 01</span><div class="indicator">BASS BOOST</div></div>
      <div class="pad" data-sound="sample2"><span>SMP 02</span><div class="indicator">INSTANT</div></div>
      <div class="pad" data-sound="sample3"><span>SMP 03</span><div class="indicator">INSTANT</div></div>
      <div class="pad" data-sound="sample4"><span>SMP 04</span><div class="indicator">INSTANT</div></div>
      <div class="pad" data-sound="sample5"><span>SMP 05</span><div class="indicator">INSTANT</div></div>
      <div class="pad" data-sound="sample6"><span>SMP 06</span><div class="indicator">INSTANT</div></div>
      <div class="pad" data-sound="sample7"><span>SMP 07</span><div class="indicator">SYNCED</div></div>
      <div class="pad" data-sound="sample8"><span>SMP 08</span><div class="indicator">SYNCED</div></div>
      <div class="pad" data-sound="sample9"><span>SMP 09</span><div class="indicator">SYNCED</div></div>

      <!-- 3 PADS GROSS BEAT / FX -->
      <div class="pad glitch-pad" data-stutter="rebreak_a"><span>RE-BREAK A</span><div class="indicator">1/32 STUTTER</div></div>
      <div class="pad glitch-pad" data-stutter="rebreak_b"><span>RE-BREAK B</span><div class="indicator">CHAOS GLITCH</div></div>
      <div class="pad glitch-pad" data-stutter="scratch"><span>SLOW TAPE STOP</span><div class="indicator">VINYL BRAKE</div></div>
    </div>
  </div>

  <script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    const audioBuffers = {};
    let drumLoopSource = null;
    let drumLoopGain = null;
    let loopStartTime = 0;

    // AUDIO NODES MASTER & FX
    let masterGain = null;
    let masterCompressor = null;
    let masterClipper = null;
    let masterFilter = null;
    let masterDistortion = null;

    // MASTER REVERB NODES
    let convolverNode = null;
    let reverbWetGain = null;

    let isMuted = false;

    const soundFiles = {
      loop: './sonidos/ps2-drumbeat.mp3',
      sample1: './sonidos/sample1.mp3',
      sample2: './sonidos/sample2.mp3',
      sample3: './sonidos/sample3.mp3',
      sample4: './sonidos/sample4.mp3',
      sample5: './sonidos/sample5.mp3',
      sample6: './sonidos/sample6.mp3',
      sample7: './sonidos/sample7.mp3',
      sample8: './sonidos/sample8.mp3',
      sample9: './sonidos/sample9.mp3',
    };

    function getUnpaddedLoopPoints(buffer) {
      const channel = buffer.getChannelData(0);
      let start = 0;
      let end = buffer.duration;
      const threshold = 0.003;

      for (let i = 0; i < channel.length; i++) {
        if (Math.abs(channel[i]) > threshold) {
          start = i / buffer.sampleRate;
          break;
        }
      }
      for (let i = channel.length - 1; i >= 0; i--) {
        if (Math.abs(channel[i]) > threshold) {
          end = i / buffer.sampleRate;
          break;
        }
      }
      if (end <= start) {
        start = 0;
        end = buffer.duration;
      }
      return { start, end };
    }

    // Generador de respuesta de impulso sintética para Reverb
    function createReverbImpulse(ctx, duration = 1.2, decay = 2.5) {
      const sampleRate = ctx.sampleRate;
      const length = sampleRate * duration;
      const impulse = ctx.createBuffer(2, length, sampleRate);
      const left = impulse.getChannelData(0);
      const right = impulse.getChannelData(1);

      for (let i = 0; i < length; i++) {
        const decayFactor = Math.pow(1 - i / length, decay);
        left[i] = (Math.random() * 2 - 1) * decayFactor;
        right[i] = (Math.random() * 2 - 1) * decayFactor;
      }
      return impulse;
    }

    // Curva de Soft Clipping para dar pegada al Master
    function makeSoftClipCurve(amount = 2.5) {
      const n_samples = 44100;
      const curve = new Float32Array(n_samples);
      for (let i = 0; i < n_samples; ++i) {
        const x = (i * 2) / n_samples - 1;
        curve[i] = Math.tanh(amount * x) / Math.tanh(amount);
      }
      return curve;
    }

    function makeDistortionCurve(amount) {
      if (amount <= 0) return null;
      const k = amount;
      const n_samples = 44100;
      const curve = new Float32Array(n_samples);
      const deg = Math.PI / 180;
      for (let i = 0; i < n_samples; ++i) {
        const x = (i * 2) / n_samples - 1;
        curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
      }
      return curve;
    }

    async function loadAudio(key, url) {
      try {
        const response = await fetch(url);
        const arrayBuffer = await response.arrayBuffer();
        audioBuffers[key] = await audioCtx.decodeAudioData(arrayBuffer);
      } catch (err) {
        console.error(`Error cargando ${key}:`, err);
      }
    }

    async function initSystem() {
      audioCtx = new AudioContext();

      // FILTRO Y DISTORSIÓN MASTER GLOBAL
      masterFilter = audioCtx.createBiquadFilter();
      masterFilter.type = 'lowpass';
      masterFilter.frequency.setValueAtTime(20000, audioCtx.currentTime);
      masterFilter.Q.setValueAtTime(1, audioCtx.currentTime);

      masterDistortion = audioCtx.createWaveShaper();

      // MÓDULO REVERB GLOBAL
      convolverNode = audioCtx.createConvolver();
      convolverNode.buffer = createReverbImpulse(audioCtx);

      reverbWetGain = audioCtx.createGain();
      reverbWetGain.gain.setValueAtTime(0, audioCtx.currentTime);

      convolverNode.connect(reverbWetGain);

      // SOFT CLIPPER & COMPRESOR MASTER (PUNCH & POTENCIA)
      masterClipper = audioCtx.createWaveShaper();
      masterClipper.curve = makeSoftClipCurve(2.2);

      masterCompressor = audioCtx.createDynamicsCompressor();
      masterCompressor.threshold.setValueAtTime(-12, audioCtx.currentTime);
      masterCompressor.knee.setValueAtTime(15, audioCtx.currentTime);
      masterCompressor.ratio.setValueAtTime(5, audioCtx.currentTime);
      masterCompressor.attack.setValueAtTime(0.002, audioCtx.currentTime);
      masterCompressor.release.setValueAtTime(0.12, audioCtx.currentTime);

      masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.8, audioCtx.currentTime);

      // RUTA DE AUDIO
      masterFilter.connect(masterDistortion);
      masterDistortion.connect(masterClipper);
      
      // Send a Reverb
      masterDistortion.connect(convolverNode);
      reverbWetGain.connect(masterClipper);

      masterClipper.connect(masterCompressor);
      masterCompressor.connect(masterGain);
      masterGain.connect(audioCtx.destination);

      const promises = Object.keys(soundFiles).map(key => loadAudio(key, soundFiles[key]));
      await Promise.all(promises);

      playDrumLoop();
    }

    function playDrumLoop() {
      if (!audioBuffers['loop']) return;

      const loopBuf = audioBuffers['loop'];
      const points = getUnpaddedLoopPoints(loopBuf);

      drumLoopSource = audioCtx.createBufferSource();
      drumLoopSource.buffer = loopBuf;
      drumLoopSource.loop = true;
      drumLoopSource.loopStart = points.start;
      drumLoopSource.loopEnd = points.end;

      drumLoopGain = audioCtx.createGain();
      drumLoopGain.gain.setValueAtTime(0.85, audioCtx.currentTime);

      drumLoopSource.connect(drumLoopGain);
      drumLoopGain.connect(masterFilter);

      loopStartTime = audioCtx.currentTime - points.start;
      drumLoopSource.start(0, points.start);
    }

    function getNextQuantizedTime(gridFraction = 16) {
      if (!audioBuffers['loop']) return audioCtx.currentTime;

      const loopBuf = audioBuffers['loop'];
      const points = getUnpaddedLoopPoints(loopBuf);
      const effectiveDuration = points.end - points.start;
      const stepDuration = effectiveDuration / gridFraction;

      const elapsed = audioCtx.currentTime - loopStartTime;
      const currentStep = elapsed / stepDuration;
      let nextStepIndex = Math.ceil(currentStep);

      let targetTime = loopStartTime + (nextStepIndex * stepDuration);

      if (targetTime - audioCtx.currentTime < 0.005) {
        targetTime += stepDuration;
      }

      return targetTime;
    }

    // MAPEO A PANTALLA COMPLETA
    function updateMasterXY(xPercent, yPercent) {
      if (!masterFilter || !masterDistortion || !reverbWetGain) return;

      // EJE Y: Filtro Paso Alto (Arriba) / Paso Bajo (Abajo)
      if (yPercent < 0.45) {
        masterFilter.type = 'highpass';
        const factor = (0.45 - yPercent) / 0.45;
        const hpFreq = Math.pow(factor, 2) * 11000 + 20;
        masterFilter.frequency.setTargetAtTime(hpFreq, audioCtx.currentTime, 0.015);
        masterFilter.Q.setTargetAtTime(1 + factor * 4, audioCtx.currentTime, 0.015);
      } else if (yPercent > 0.55) {
        masterFilter.type = 'lowpass';
        const factor = (yPercent - 0.55) / 0.45;
        const lpFreq = Math.pow(1 - factor, 2) * 18000 + 90;
        masterFilter.frequency.setTargetAtTime(lpFreq, audioCtx.currentTime, 0.015);
        masterFilter.Q.setTargetAtTime(1 + factor * 4, audioCtx.currentTime, 0.015);
      } else {
        masterFilter.type = 'lowpass';
        masterFilter.frequency.setTargetAtTime(20000, audioCtx.currentTime, 0.015);
        masterFilter.Q.setTargetAtTime(1, audioCtx.currentTime, 0.015);
      }

      // EJE X: Izquierda = REVERB | Derecha = DISTORSIÓN
      if (xPercent < 0.45) {
        const reverbAmount = (0.45 - xPercent) / 0.45;
        reverbWetGain.gain.setTargetAtTime(reverbAmount * 0.85, audioCtx.currentTime, 0.015);
        masterDistortion.curve = null;
      } else if (xPercent > 0.55) {
        const distFactor = (xPercent - 0.55) / 0.45;
        const distAmount = Math.pow(distFactor, 2) * 60;
        masterDistortion.curve = makeDistortionCurve(distAmount);
        reverbWetGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.015);
      } else {
        reverbWetGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.015);
        masterDistortion.curve = null;
      }
    }

    function resetMasterFilter() {
      if (masterFilter) {
        masterFilter.type = 'lowpass';
        masterFilter.frequency.setTargetAtTime(20000, audioCtx.currentTime, 0.08);
        masterFilter.Q.setTargetAtTime(1, audioCtx.currentTime, 0.08);
      }
      if (masterDistortion) {
        masterDistortion.curve = null;
      }
      if (reverbWetGain) {
        reverbWetGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.08);
      }
    }

    // -------------------------------------------------------------
    // PADS: SAMPLES CONTINUOS MIENTRAS SE MANTIENEN PRESIONADOS
    // -------------------------------------------------------------
    const activePadNodes = {};

    function startPadSound(padId, soundKey) {
      if (!audioBuffers[soundKey]) return;

      stopPadSound(padId, true);

      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffers[soundKey];
      source.loop = true; // Permite sonar sin límite mientras esté presionado

      const padGain = audioCtx.createGain();
      padGain.gain.setValueAtTime(0.8, audioCtx.currentTime);

      if (soundKey === 'sample1') {
        const bassFilter = audioCtx.createBiquadFilter();
        bassFilter.type = 'peaking';
        bassFilter.frequency.setValueAtTime(1200, audioCtx.currentTime);
        bassFilter.gain.setValueAtTime(12, audioCtx.currentTime);
        bassFilter.Q.setValueAtTime(1.5, audioCtx.currentTime);

        const bassDist = audioCtx.createWaveShaper();
        bassDist.curve = makeDistortionCurve(35);

        source.connect(padGain);
        padGain.connect(bassFilter);
        bassFilter.connect(bassDist);
        bassDist.connect(masterFilter);
      } else {
        source.connect(padGain);
        padGain.connect(masterFilter);
      }

      const unquantizedSamples = ['sample2', 'sample3', 'sample4', 'sample5', 'sample6'];
      const isInstant = unquantizedSamples.includes(soundKey);

      const startTime = isInstant ? audioCtx.currentTime : getNextQuantizedTime(16);

      source.start(startTime);
      activePadNodes[padId] = { source, padGain };
    }

    function stopPadSound(padId, immediate = false) {
      if (activePadNodes[padId]) {
        const { source, padGain } = activePadNodes[padId];
        delete activePadNodes[padId];

        const now = audioCtx.currentTime;
        if (immediate) {
          try {
            source.stop();
            source.disconnect();
          } catch (e) {}
        } else {
          // Fade-out suave al soltar el dedo
          try {
            padGain.gain.cancelScheduledValues(now);
            padGain.gain.setValueAtTime(Math.max(0.0001, padGain.gain.value), now);
            padGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.03);
            source.stop(now + 0.035);
          } catch (e) {
            try { source.stop(); } catch(err) {}
          }
        }
      }
    }

    // -------------------------------------------------------------
    // EFECTOS RE-BREAK A (1/32 STUTTER) Y RE-BREAK B (ULTRA CAOS)
    // -------------------------------------------------------------
    let isStutterActive = false;
    let currentStutterSource = null;
    let stutterInterval = null;
    let stutterTimeout = null;

    function startStutter(type) {
      if (!drumLoopSource || !audioBuffers['loop']) return;
      stopStutter();

      isStutterActive = true;

      const buffer = audioBuffers['loop'];
      const loopPoints = getUnpaddedLoopPoints(buffer);
      const effectiveDuration = loopPoints.end - loopPoints.start;

      const startTime = getNextQuantizedTime(16);
      const initialDelay = Math.max(0, (startTime - audioCtx.currentTime) * 1000);

      if (type === 'scratch') {
        stutterTimeout = setTimeout(() => {
          if (!isStutterActive) return;

          drumLoopGain.gain.cancelScheduledValues(audioCtx.currentTime);
          drumLoopGain.gain.setValueAtTime(0, audioCtx.currentTime);

          const elapsed = audioCtx.currentTime - loopStartTime;
          const currentPos = loopPoints.start + (elapsed % effectiveDuration);

          currentStutterSource = audioCtx.createBufferSource();
          currentStutterSource.buffer = buffer;

          const stutterGain = audioCtx.createGain();
          stutterGain.gain.setValueAtTime(0.85, audioCtx.currentTime);

          currentStutterSource.connect(stutterGain);
          stutterGain.connect(masterFilter);

          currentStutterSource.start(0, currentPos);

          currentStutterSource.playbackRate.setValueAtTime(1.0, audioCtx.currentTime);
          currentStutterSource.playbackRate.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.1);
        }, initialDelay);
        return;
      }

      // 1/32 DE TIEMPO DE COMPÁS
      const slice32Duration = effectiveDuration / 32;

      if (type === 'rebreak_a') {
        // RE-BREAK A: LOOP INFINITO DEL ÚLTIMO 1/32 DE COMPÁS
        stutterTimeout = setTimeout(() => {
          if (!isStutterActive) return;

          drumLoopGain.gain.cancelScheduledValues(audioCtx.currentTime);
          drumLoopGain.gain.setValueAtTime(0, audioCtx.currentTime);

          const elapsed = audioCtx.currentTime - loopStartTime;
          const currentPos = elapsed % effectiveDuration;
          
          const sliceIndex = Math.floor(currentPos / slice32Duration);
          const sliceStart = loopPoints.start + (sliceIndex * slice32Duration);

          currentStutterSource = audioCtx.createBufferSource();
          currentStutterSource.buffer = buffer;
          currentStutterSource.loop = true;
          currentStutterSource.loopStart = sliceStart;
          currentStutterSource.loopEnd = sliceStart + slice32Duration;

          const stutterGain = audioCtx.createGain();
          stutterGain.gain.setValueAtTime(0.85, audioCtx.currentTime);

          currentStutterSource.connect(stutterGain);
          stutterGain.connect(masterFilter);

          currentStutterSource.start(0, sliceStart);
        }, initialDelay);
        return;
      }

      if (type === 'rebreak_b') {
        // RE-BREAK B: ULTRA CAÓTICO CON MICRO-PITCH Y SALTOS ALEATORIOS
        stutterTimeout = setTimeout(() => {
          if (!isStutterActive) return;

          drumLoopGain.gain.cancelScheduledValues(audioCtx.currentTime);
          drumLoopGain.gain.setValueAtTime(0, audioCtx.currentTime);

          function playUltraCaosStep() {
            if (!isStutterActive) return;

            const randomSliceIndex = Math.floor(Math.random() * 32);
            const sliceStartTime = loopPoints.start + (randomSliceIndex * slice32Duration);

            const sliceSource = audioCtx.createBufferSource();
            sliceSource.buffer = buffer;

            // Variación aleatoria de velocidad/pitch para tono caótico
            const randomPitch = 0.88 + Math.random() * 0.38;
            sliceSource.playbackRate.setValueAtTime(randomPitch, audioCtx.currentTime);

            const sliceGain = audioCtx.createGain();
            sliceGain.gain.setValueAtTime(0.85, audioCtx.currentTime);

            sliceSource.connect(sliceGain);
            sliceGain.connect(masterFilter);

            sliceSource.start(audioCtx.currentTime, sliceStartTime, slice32Duration * 1.1);

            currentStutterSource = sliceSource;
          }

          playUltraCaosStep();
          stutterInterval = setInterval(playUltraCaosStep, slice32Duration * 1000);
        }, initialDelay);
      }
    }

    function stopStutter() {
      isStutterActive = false;

      if (stutterTimeout) {
        clearTimeout(stutterTimeout);
        stutterTimeout = null;
      }
      if (stutterInterval) {
        clearInterval(stutterInterval);
        stutterInterval = null;
      }
      if (currentStutterSource) {
        try {
          currentStutterSource.stop();
          currentStutterSource.disconnect();
        } catch(e) {}
        currentStutterSource = null;
      }

      if (drumLoopGain && audioCtx) {
        drumLoopGain.gain.cancelScheduledValues(audioCtx.currentTime);
        drumLoopGain.gain.setValueAtTime(0.85, audioCtx.currentTime);
      }
    }

    // MUTE
    const muteBtn = document.getElementById('muteBtn');
    const statusIndicator = document.getElementById('statusIndicator');

    muteBtn.addEventListener('click', () => {
      if (!audioCtx || !masterGain) return;
      isMuted = !isMuted;

      if (isMuted) {
        masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
        masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
        muteBtn.classList.add('muted');
        muteBtn.textContent = 'MUTED';
        statusIndicator.style.color = '#ff0055';
        statusIndicator.textContent = 'x MUTED';
      } else {
        masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
        masterGain.gain.setValueAtTime(0.8, audioCtx.currentTime);
        muteBtn.classList.remove('muted');
        muteBtn.textContent = 'MUTE';
        statusIndicator.style.color = '#00ff66';
        statusIndicator.textContent = '● DRUM LOOP ACTIVE';
      }
    });

    // EVENTOS TÁCTILES Y ARRASTRE
    const playBtn = document.getElementById('playBtn');
    const startScreen = document.getElementById('startScreen');
    const app = document.getElementById('app');

    playBtn.addEventListener('click', async () => {
      startScreen.style.display = 'none';
      app.style.display = 'flex';
      await initSystem();
    });

    let isDraggingFX = false;
    let startX = 0;
    let startY = 0;

    document.querySelectorAll('.pad').forEach((pad, index) => {
      const padId = `pad_${index}`;
      const soundKey = pad.dataset.sound;
      const stutterType = pad.dataset.stutter;

      pad.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        pad.classList.add('active');

        startX = e.clientX;
        startY = e.clientY;
        isDraggingFX = false;

        resetMasterFilter();

        if (soundKey) {
          startPadSound(padId, soundKey);
        } else if (stutterType) {
          startStutter(stutterType);
        }
      });

      pad.addEventListener('pointermove', (e) => {
        if (!pad.classList.contains('active')) return;

        const distance = Math.hypot(e.clientX - startX, e.clientY - startY);
        if (distance > 12) {
          isDraggingFX = true;
        }

        if (isDraggingFX) {
          const xPercent = Math.max(0, Math.min(e.clientX / window.innerWidth, 1));
          const yPercent = Math.max(0, Math.min(e.clientY / window.innerHeight, 1));

          updateMasterXY(xPercent, yPercent);
        }
      });

      const endHandler = (e) => {
        pad.classList.remove('active');
        isDraggingFX = false;
        resetMasterFilter();

        if (soundKey) {
          stopPadSound(padId);
        }
        if (stutterType) {
          stopStutter();
        }
      };

      pad.addEventListener('pointerup', endHandler);
      pad.addEventListener('pointerleave', endHandler);
      pad.addEventListener('pointercancel', endHandler);
    });
  </script>
</body>
</html>
