<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
  <title>PS2 Jungle DrumPad</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@600;800&family=Chakra+Petch:wght@500;700&display=swap');

    * {
      box-sizing: border-box;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #02040a;
      color: #00f0ff;
      font-family: 'Chakra Petch', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Video de fondo */
    #bgVideo {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      z-index: -2;
      object-fit: cover;
      opacity: 0.6;
      transition: filter 0.05s ease-out; /* Para que el flash de graves sea suave */
    }

    /* Filtro sobre el video para oscurecer y dar textura CRT */
    .video-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: 
        linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2) 1px, transparent 1px, transparent 2px),
        radial-gradient(circle at center, rgba(10, 20, 53, 0.3) 0%, rgba(2, 4, 10, 0.8) 100%);
      background-size: 40px 40px, 100% 100%, 100% 100%;
      pointer-events: none;
      z-index: -1;
    }

    #startScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      background: rgba(2, 4, 10, 0.8);
      backdrop-filter: blur(5px);
    }

    .start-content {
      background: rgba(2, 4, 10, 0.75);
      padding: 20px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid rgba(0, 240, 255, 0.3);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 100, 255, 0.2);
    }

    #startScreen h1 {
      font-family: 'Oxanium', sans-serif;
      font-size: 2rem;
      letter-spacing: 4px;
      margin-bottom: 6px;
      color: #ffffff;
      text-transform: uppercase;
      text-align: center;
      text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
    }

    #startScreen p {
      font-size: 0.8rem;
      color: #70a0ff;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    .play-btn {
      font-family: 'Oxanium', sans-serif;
      background: linear-gradient(135deg, #00f0ff, #0044ff);
      border: 2px solid #ffffff;
      border-radius: 50px;
      color: #ffffff;
      padding: 14px 40px;
      font-size: 1.2rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 3px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 150, 255, 0.7);
      transition: transform 0.1s ease;
    }

    .play-btn:active {
      transform: scale(0.95);
    }

    #app {
      display: none;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      padding: 10px 12px;
      flex-direction: column;
      justify-content: space-between;
      background: rgba(5, 12, 30, 0.3);
      backdrop-filter: blur(4px);
      border-left: 1px solid rgba(0, 240, 255, 0.15);
      border-right: 1px solid rgba(0, 240, 255, 0.15);
      z-index: 10;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: rgba(0, 119, 255, 0.12);
      border: 1px solid rgba(0, 240, 255, 0.35);
      border-radius: 6px;
      margin-bottom: 10px;
      box-shadow: 0 0 10px rgba(0, 150, 255, 0.2);
    }

    .header-left {
      display: flex;
      flex-direction: column;
    }

    .header .logo {
      font-family: 'Oxanium', sans-serif;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
    }

    .status {
      font-size: 0.6rem;
      color: #00ff66;
      text-shadow: 0 0 5px #00ff66;
      letter-spacing: 1px;
    }

    /* Osciloscopio */
    #visualizer {
      width: 120px;
      height: 35px;
      background: #02040a;
      border: 1px solid rgba(0, 240, 255, 0.5);
      border-radius: 4px;
      box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.2);
    }

    .mute-btn {
      background: rgba(255, 0, 85, 0.15);
      border: 1px solid #ff0055;
      color: #ff0055;
      font-family: 'Oxanium', sans-serif;
      font-size: 0.6rem;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 6px rgba(255, 0, 85, 0.3);
      transition: all 0.15s ease;
    }

    .mute-btn:active {
      transform: scale(0.92);
    }

    .mute-btn.muted {
      background: #ff0055;
      color: #ffffff;
      box-shadow: 0 0 12px #ff0055;
    }

    .pad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 6px;
      flex-grow: 1;
      margin-bottom: 4px;
    }

    .pad {
      background: linear-gradient(145deg, rgba(22, 35, 75, 0.85), rgba(11, 18, 45, 0.95));
      border: 1.5px solid rgba(0, 180, 255, 0.35);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #a0c0e0;
      font-weight: bold;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.6), inset 0 0 6px rgba(0, 150, 255, 0.05);
      padding: 4px;
    }

    .pad.active {
      border-color: #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.7), inset 0 0 8px rgba(0, 240, 255, 0.3);
      background: linear-gradient(145deg, rgba(30, 60, 120, 0.95), rgba(15, 30, 70, 0.95));
      color: #ffffff;
    }

    .pad.glitch-pad {
      background: linear-gradient(145deg, rgba(58, 22, 40, 0.85), rgba(36, 11, 23, 0.95));
      border-color: rgba(255, 0, 85, 0.45);
      color: #ffa0c0;
    }

    .pad.glitch-pad.active {
      border-color: #ff0055;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.7), inset 0 0 8px rgba(255, 0, 85, 0.3);
      background: linear-gradient(145deg, rgba(120, 20, 60, 0.95), rgba(70, 10, 35, 0.95));
      color: #ffffff;
    }

    .pad span {
      pointer-events: none;
      text-transform: uppercase;
      font-family: 'Oxanium', sans-serif;
      font-size: 0.7rem;
      text-align: center;
      line-height: 1.1;
      display: block;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- Video de Fondo -->
  <video id="bgVideo" autoplay loop muted playsinline>
    <source src="./tu-video.mp4" type="video/mp4">
  </video>
  <div class="video-overlay"></div>

  <div id="startScreen">
    <div class="start-content">
      <h1>PS2 JUNGLE PAD</h1>
      <p>TAP TO START SOUND SYSTEM</p>
      <button class="play-btn" id="playBtn">PLAY</button>
    </div>
  </div>

  <div id="app">
    <div class="header">
      <div class="header-left">
        <div class="logo">PS2 // BREAKS</div>
        <div class="status" id="statusIndicator">● LOOP ACTIVE</div>
      </div>
      <!-- Osciloscopio -->
      <canvas id="visualizer"></canvas>
      <button id="muteBtn" class="mute-btn">LOOP MUTE</button>
    </div>

    <div class="pad-grid">
      <div class="pad" data-sound="sample1"><span>Bass</span></div>
      <div class="pad" data-sound="sample2"><span>FX</span></div>
      <div class="pad" data-sound="sample3"><span>Scratch</span></div>
      <div class="pad" data-sound="sample4"><span>Pad</span></div>
      <div class="pad" data-sound="sample5"><span>Pad</span></div>
      <div class="pad" data-sound="sample6"><span>Pad</span></div>
      <div class="pad" data-sound="sample7"><span>Pad<br>Atmospheric</span></div>
      <div class="pad" data-sound="sample8"><span>Vox</span></div>
      <div class="pad" data-sound="sample9"><span>Pluck</span></div>
      <div class="pad" data-sound="sample10"><span>Chord</span></div>
      <div class="pad" data-sound="sample11"><span>Chord</span></div>
      <div class="pad" data-sound="sample12"><span>Chord</span></div>

      <div class="pad glitch-pad" data-stutter="rebreak_a"><span>RE-BREAK A</span></div>
      <div class="pad glitch-pad" data-stutter="rebreak_b"><span>RE-BREAK B</span></div>
      <div class="pad glitch-pad" data-stutter="scratch"><span>SLOW TAPE STOP</span></div>
    </div>
  </div>

  <script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    let masterAnalyser; 

    const audioBuffers = {};
    let drumLoopSource = null;
    let drumLoopGain = null;
    let loopStartTime = 0;

    let masterGain = null;
    let masterCompressor = null;
    let masterClipper = null;
    let masterFilter = null;
    
    let flangerDelay = null, flangerFeedback = null, flangerDepth = null, flangerLFO = null, flangerGain = null;
    let phaserFilter = null, phaserFeedback = null, phaserLFO = null, phaserGain = null;
    let convolverNode = null, reverbWetGain = null;

    let isMuted = false;
    const TOTAL_BARS = 8;

    // Referencias al Visualizador y Fondo Reactivo
    const canvas = document.getElementById('visualizer');
    const canvasCtx = canvas.getContext('2d');
    const bgVideo = document.getElementById('bgVideo');
    canvas.width = 240; 
    canvas.height = 70;

    const soundFiles = {
      loop: './sonidos/ps2-drumbeat.mp3',
      sample1: './sonidos/sample1.mp3',
      sample2: './sonidos/sample2.mp3',
      sample3: './sonidos/sample3.mp3',
      sample4: './sonidos/sample4.mp3',
      sample5: './sonidos/sample5.mp3',
      sample6: './sonidos/sample6.mp3',
      sample7: './sonidos/sample7.mp3',
      sample8: './sonidos/sample8.mp3',
      sample9: './sonidos/sample9.mp3',
      sample10: './sonidos/sample10.mp3',
      sample11: './sonidos/sample11.mp3',
      sample12: './sonidos/sample12.mp3',
    };

    function getUnpaddedLoopPoints(buffer) {
      const channel = buffer.getChannelData(0);
      let start = 0, end = buffer.duration;
      const threshold = 0.003;
      for (let i = 0; i < channel.length; i++) if (Math.abs(channel[i]) > threshold) { start = i / buffer.sampleRate; break; }
      for (let i = channel.length - 1; i >= 0; i--) if (Math.abs(channel[i]) > threshold) { end = i / buffer.sampleRate; break; }
      if (end <= start) { start = 0; end = buffer.duration; }
      return { start, end };
    }

    function createReverbImpulse(ctx, duration = 1.2, decay = 2.5) {
      const sampleRate = ctx.sampleRate;
      const length = sampleRate * duration;
      const impulse = ctx.createBuffer(2, length, sampleRate);
      const left = impulse.getChannelData(0), right = impulse.getChannelData(1);
      for (let i = 0; i < length; i++) {
        const decayFactor = Math.pow(1 - i / length, decay);
        left[i] = (Math.random() * 2 - 1) * decayFactor;
        right[i] = (Math.random() * 2 - 1) * decayFactor;
      }
      return impulse;
    }

    function makeSoftClipCurve(amount = 2.2) {
      const n_samples = 44100;
      const curve = new Float32Array(n_samples);
      for (let i = 0; i < n_samples; ++i) {
        const x = (i * 2) / n_samples - 1;
        curve[i] = Math.tanh(amount * x) / Math.tanh(amount);
      }
      return curve;
    }

    async function loadAudio(key, url) {
      try {
        const response = await fetch(url);
        const arrayBuffer = await response.arrayBuffer();
        audioBuffers[key] = await audioCtx.decodeAudioData(arrayBuffer);
      } catch (err) { console.error(`Error cargando ${key}:`, err); }
    }

    async function initSystem() {
      audioCtx = new AudioContext();

      // Nodo Analizador
      masterAnalyser = audioCtx.createAnalyser();
      masterAnalyser.fftSize = 1024;
      masterAnalyser.smoothingTimeConstant = 0.8;

      masterFilter = audioCtx.createBiquadFilter();
      masterFilter.type = 'lowpass';
      masterFilter.frequency.setValueAtTime(20000, audioCtx.currentTime);
      masterFilter.Q.setValueAtTime(1, audioCtx.currentTime);

      flangerDelay = audioCtx.createDelay();
      flangerDelay.delayTime.setValueAtTime(0.005, audioCtx.currentTime);
      flangerFeedback = audioCtx.createGain();
      flangerFeedback.gain.setValueAtTime(0.5, audioCtx.currentTime);
      flangerDepth = audioCtx.createGain();
      flangerDepth.gain.setValueAtTime(0.002, audioCtx.currentTime);
      flangerLFO = audioCtx.createOscillator();
      flangerLFO.frequency.setValueAtTime(0.3, audioCtx.currentTime);
      flangerLFO.connect(flangerDepth);
      flangerDepth.connect(flangerDelay.delayTime);
      flangerDelay.connect(flangerFeedback);
      flangerFeedback.connect(flangerDelay);
      flangerLFO.start();
      flangerGain = audioCtx.createGain();
      flangerGain.gain.setValueAtTime(0, audioCtx.currentTime);

      phaserFilter = audioCtx.createBiquadFilter();
      phaserFilter.type = 'allpass';
      phaserFilter.frequency.setValueAtTime(1000, audioCtx.currentTime);
      phaserFilter.Q.setValueAtTime(3, audioCtx.currentTime);
      phaserFeedback = audioCtx.createGain();
      phaserFeedback.gain.setValueAtTime(0.6, audioCtx.currentTime);
      phaserFilter.connect(phaserFeedback);
      phaserFeedback.connect(phaserFilter);
      phaserLFO = audioCtx.createOscillator();
      phaserLFO.frequency.setValueAtTime(0.5, audioCtx.currentTime);
      const phaserLfoGain = audioCtx.createGain();
      phaserLfoGain.gain.setValueAtTime(800, audioCtx.currentTime);
      phaserLFO.connect(phaserLfoGain);
      phaserLfoGain.connect(phaserFilter.frequency);
      phaserLFO.start();
      phaserGain = audioCtx.createGain();
      phaserGain.gain.setValueAtTime(0, audioCtx.currentTime);

      convolverNode = audioCtx.createConvolver();
      convolverNode.buffer = createReverbImpulse(audioCtx);
      reverbWetGain = audioCtx.createGain();
      reverbWetGain.gain.setValueAtTime(0, audioCtx.currentTime);
      convolverNode.connect(reverbWetGain);

      masterClipper = audioCtx.createWaveShaper();
      masterClipper.curve = makeSoftClipCurve(2.2);

      masterCompressor = audioCtx.createDynamicsCompressor();
      masterCompressor.threshold.setValueAtTime(-12, audioCtx.currentTime);
      masterCompressor.knee.setValueAtTime(15, audioCtx.currentTime);
      masterCompressor.ratio.setValueAtTime(5, audioCtx.currentTime);
      masterCompressor.attack.setValueAtTime(0.002, audioCtx.currentTime);
      masterCompressor.release.setValueAtTime(0.12, audioCtx.currentTime);

      masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.8, audioCtx.currentTime);

      // Conexiones de la cadena
      masterFilter.connect(flangerDelay);
      flangerDelay.connect(flangerGain);
      flangerGain.connect(masterClipper);

      masterFilter.connect(phaserFilter);
      phaserFilter.connect(phaserGain);
      phaserGain.connect(masterClipper);

      masterFilter.connect(convolverNode);
      reverbWetGain.connect(masterClipper);

      masterFilter.connect(masterClipper);

      masterClipper.connect(masterCompressor);
      masterCompressor.connect(masterGain);
      
      // Conectar gain al Analizador, y Analizador a los parlantes
      masterGain.connect(masterAnalyser);
      masterAnalyser.connect(audioCtx.destination);

      const promises = Object.keys(soundFiles).map(key => loadAudio(key, soundFiles[key]));
      await Promise.all(promises);

      playDrumLoop();
      drawVisualizer(); // Iniciar osciloscopio y video
      if(bgVideo) bgVideo.play();
    }

    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      if (!masterAnalyser) return;

      const bufferLength = masterAnalyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      const freqData = new Uint8Array(bufferLength);
      
      masterAnalyser.getByteTimeDomainData(dataArray);
      masterAnalyser.getByteFrequencyData(freqData);

      // 1. Dibujar Osciloscopio
      canvasCtx.fillStyle = '#02040a';
      canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
      canvasCtx.lineWidth = 2.5;
      canvasCtx.strokeStyle = '#00f0ff';
      canvasCtx.beginPath();

      const sliceWidth = canvas.width * 1.0 / bufferLength;
      let x = 0;
      for (let i = 0; i < bufferLength; i++) {
        const v = dataArray[i] / 128.0;
        const y = v * canvas.height / 2;
        if (i === 0) canvasCtx.moveTo(x, y);
        else canvasCtx.lineTo(x, y);
        x += sliceWidth;
      }
      canvasCtx.lineTo(canvas.width, canvas.height / 2);
      canvasCtx.stroke();

      // 2. Video Reactivo
      let bassSum = 0;
      for(let i = 0; i < 5; i++) {
        bassSum += freqData[i];
      }
      const bassAvg = bassSum / 5;
      const bassIntensity = bassAvg / 255;

      if (bgVideo) {
        const brightness = 0.6 + (bassIntensity * 0.5);
        const scale = 1 + (bassIntensity * 0.03);
        bgVideo.style.filter = `brightness(${brightness})`;
        bgVideo.style.transform = `translate(-50%, -50%) scale(${scale})`;
      }
    }

    function playDrumLoop() {
      if (!audioBuffers['loop']) return;
      const loopBuf = audioBuffers['loop'];
      const points = getUnpaddedLoopPoints(loopBuf);

      drumLoopSource = audioCtx.createBufferSource();
      drumLoopSource.buffer = loopBuf;
      drumLoopSource.loop = true;
      drumLoopSource.loopStart = points.start;
      drumLoopSource.loopEnd = points.end;

      drumLoopGain = audioCtx.createGain();
      drumLoopGain.gain.setValueAtTime(1.15, audioCtx.currentTime);

      drumLoopSource.connect(drumLoopGain);
      drumLoopGain.connect(masterFilter);

      loopStartTime = audioCtx.currentTime - points.start;
      drumLoopSource.start(0, points.start);
    }

    function getNextQuantizedTime(divisionsPerBar = 16) {
      if (!audioBuffers['loop']) return audioCtx.currentTime;
      const loopBuf = audioBuffers['loop'];
      const points = getUnpaddedLoopPoints(loopBuf);
      const effectiveDuration = points.end - points.start;
      
      const barDuration = effectiveDuration / TOTAL_BARS; 
      const stepDuration = barDuration / divisionsPerBar;

      const elapsed = audioCtx.currentTime - loopStartTime;
      const currentStep = elapsed / stepDuration;
      let nextStepIndex = Math.ceil(currentStep);

      let targetTime = loopStartTime + (nextStepIndex * stepDuration);
      if (targetTime - audioCtx.currentTime < 0.005) {
        targetTime += stepDuration;
      }
      return targetTime;
    }

    function updateMasterXY(xPercent, yPercent) {
      if (!masterFilter || !flangerGain || !phaserGain) return;

      if (yPercent < 0.45) {
        masterFilter.type = 'highpass';
        const factor = (0.45 - yPercent) / 0.45;
        const hpFreq = Math.pow(factor, 2) * 11000 + 20;
        masterFilter.frequency.setTargetAtTime(hpFreq, audioCtx.currentTime, 0.015);
        masterFilter.Q.setTargetAtTime(1 + factor * 4, audioCtx.currentTime, 0.015);
      } else if (yPercent > 0.55) {
        masterFilter.type = 'lowpass';
        const factor = (yPercent - 0.55) / 0.45;
        const lpFreq = Math.pow(1 - factor, 2) * 18000 + 90;
        masterFilter.frequency.setTargetAtTime(lpFreq, audioCtx.currentTime, 0.015);
        masterFilter.Q.setTargetAtTime(1 + factor * 4, audioCtx.currentTime, 0.015);
      } else {
        masterFilter.type = 'lowpass';
        masterFilter.frequency.setTargetAtTime(20000, audioCtx.currentTime, 0.015);
        masterFilter.Q.setTargetAtTime(1, audioCtx.currentTime, 0.015);
      }

      if (xPercent < 0.45) {
        const flangerAmount = (0.45 - xPercent) / 0.45;
        flangerGain.gain.setTargetAtTime(flangerAmount * 0.9, audioCtx.currentTime, 0.015);
        phaserGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.015);
      } else if (xPercent > 0.55) {
        const phaserAmount = (xPercent - 0.55) / 0.45;
        phaserGain.gain.setTargetAtTime(phaserAmount * 0.9, audioCtx.currentTime, 0.015);
        flangerGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.015);
      } else {
        flangerGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.015);
        phaserGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.015);
      }
    }

    function resetMasterFilter() {
      if (masterFilter) {
        masterFilter.type = 'lowpass';
        masterFilter.frequency.setTargetAtTime(20000, audioCtx.currentTime, 0.08);
        masterFilter.Q.setTargetAtTime(1, audioCtx.currentTime, 0.08);
      }
      if (flangerGain) flangerGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.08);
      if (phaserGain) phaserGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.08);
    }

    const activePadNodes = {};

    function startPadSound(padId, soundKey) {
      if (!audioBuffers[soundKey]) return;

      if (activePadNodes[padId]) {
        executeStop(padId, 0.03);
      }

      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffers[soundKey];
      const padGain = audioCtx.createGain();
      padGain.gain.setValueAtTime(0.8, audioCtx.currentTime);

      let durationInBars = 1/16; 
      let tailLength = 0.03;     

      if (['sample1', 'sample2', 'sample3', 'sample4', 'sample5', 'sample6', 'sample9'].includes(soundKey)) {
        durationInBars = 1;      
        tailLength = 1.0;        
      } else if (['sample7'].includes(soundKey)) {
        durationInBars = 4;      
        tailLength = 1.0;        
      } else if (['sample8', 'sample10', 'sample11', 'sample12'].includes(soundKey)) {
        durationInBars = 0.25;   
        tailLength = 0.1;        
      }

      source.loop = true;

      if (soundKey === 'sample1') {
        const bassFilter = audioCtx.createBiquadFilter();
        bassFilter.type = 'peaking';
        bassFilter.frequency.setValueAtTime(1200, audioCtx.currentTime);
        bassFilter.gain.setValueAtTime(12, audioCtx.currentTime);
        bassFilter.Q.setValueAtTime(1.5, audioCtx.currentTime);

        source.connect(padGain);
        padGain.connect(bassFilter);
        bassFilter.connect(masterFilter);
      } else {
        source.connect(padGain);
        padGain.connect(masterFilter);
      }

      source.start(audioCtx.currentTime);

      activePadNodes[padId] = { 
        source, 
        padGain, 
        isHeld: false, 
        durationInBars: durationInBars,
        tailLength: tailLength,
        startTime: audioCtx.currentTime 
      };
    }

    function stopPadSound(padId) {
      if (!activePadNodes[padId]) return;
      const nodeData = activePadNodes[padId];
      const { isHeld, durationInBars, tailLength } = nodeData;

      if (isHeld) {
        executeStop(padId, tailLength > 0.5 ? 0.3 : tailLength);
      } else {
        const loopBuf = audioBuffers['loop'];
        const points = getUnpaddedLoopPoints(loopBuf);
        const effectiveDuration = points.end - points.start;
        const barDuration = effectiveDuration / TOTAL_BARS; 
        
        const targetDuration = barDuration * durationInBars;
        const elapsed = audioCtx.currentTime - nodeData.startTime;
        const remainingTime = Math.max(0, targetDuration - elapsed);

        setTimeout(() => {
          if (activePadNodes[padId] && !activePadNodes[padId].isHeld) {
            executeStop(padId, tailLength);
          }
        }, remainingTime * 1000);
      }
    }

    function executeStop(padId, fadeTime = 0.03) {
      if (!activePadNodes[padId]) return;
      const { source, padGain } = activePadNodes[padId];
      delete activePadNodes[padId];

      const now = audioCtx.currentTime;
      try {
        padGain.gain.cancelScheduledValues(now);
        padGain.gain.setValueAtTime(Math.max(0.0001, padGain.gain.value), now);
        padGain.gain.exponentialRampToValueAtTime(0.0001, now + fadeTime);
        source.stop(now + fadeTime + 0.05);
      } catch (e) {
        try { source.stop(); } catch(err) {}
      }
    }

    function holdPadSound(padId) {
      if (activePadNodes[padId]) {
        activePadNodes[padId].isHeld = true;
      }
    }

    let isStutterActive = false;
    let currentStutterSource = null;
    let stutterTimeout = null;

    function startStutter(type) {
      if (!drumLoopSource || !audioBuffers['loop']) return;
      stopStutter();

      isStutterActive = true;
      const buffer = audioBuffers['loop'];
      const loopPoints = getUnpaddedLoopPoints(buffer);
      const effectiveDuration = loopPoints.end - loopPoints.start;
      const barDuration = effectiveDuration / TOTAL_BARS;

      const startTime = getNextQuantizedTime(16);
      const initialDelay = Math.max(0, (startTime - audioCtx.currentTime) * 1000);

      if (type === 'scratch') {
        stutterTimeout = setTimeout(() => {
          if (!isStutterActive) return;

          drumLoopGain.gain.cancelScheduledValues(audioCtx.currentTime);
          drumLoopGain.gain.setValueAtTime(0, audioCtx.currentTime);

          const elapsed = audioCtx.currentTime - loopStartTime;
          const currentPos = loopPoints.start + (elapsed % effectiveDuration); 

          currentStutterSource = audioCtx.createBufferSource();
          currentStutterSource.buffer = buffer;

          const stutterGain = audioCtx.createGain();
          stutterGain.gain.setValueAtTime(1.15, audioCtx.currentTime);

          currentStutterSource.connect(stutterGain);
          stutterGain.connect(masterFilter);

          currentStutterSource.start(0, currentPos);
          currentStutterSource.playbackRate.setValueAtTime(1.0, audioCtx.currentTime);
          currentStutterSource.playbackRate.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.1);
        }, initialDelay);
        return;
      }

      if (type === 'rebreak_a') {
        const beatDuration = barDuration / 4; 
        
        stutterTimeout = setTimeout(() => {
          if (!isStutterActive) return;

          drumLoopGain.gain.cancelScheduledValues(audioCtx.currentTime);
          drumLoopGain.gain.setValueAtTime(0, audioCtx.currentTime);

          const elapsedAtTarget = startTime - loopStartTime;
          const sliceStart = loopPoints.start + (elapsedAtTarget % effectiveDuration);

          currentStutterSource = audioCtx.createBufferSource();
          currentStutterSource.buffer = buffer;
          currentStutterSource.loop = true;
          currentStutterSource.loopStart = sliceStart;
          currentStutterSource.loopEnd = sliceStart + beatDuration;

          const stutterGain = audioCtx.createGain();
          stutterGain.gain.setValueAtTime(1.15, audioCtx.currentTime);

          currentStutterSource.connect(stutterGain);
          stutterGain.connect(masterFilter);

          currentStutterSource.start(0, sliceStart);
        }, initialDelay);
        return;
      }

      if (type === 'rebreak_b') {
        const slice16Duration = barDuration / 16;
        const slice32Duration = barDuration / 32;
        const targetSliceStart = loopPoints.start + (4 * slice16Duration);

        stutterTimeout = setTimeout(() => {
          if (!isStutterActive) return;

          drumLoopGain.gain.cancelScheduledValues(audioCtx.currentTime);
          drumLoopGain.gain.setValueAtTime(0, audioCtx.currentTime);

          currentStutterSource = audioCtx.createBufferSource();
          currentStutterSource.buffer = buffer;
          currentStutterSource.loop = true;
          currentStutterSource.loopStart = targetSliceStart;
          currentStutterSource.loopEnd = targetSliceStart + slice32Duration;

          const stutterGain = audioCtx.createGain();
          stutterGain.gain.setValueAtTime(1.15, audioCtx.currentTime);

          currentStutterSource.connect(stutterGain);
          stutterGain.connect(masterFilter);

          currentStutterSource.start(0, targetSliceStart);
          
          const dosTiempos = barDuration / 2; 
          currentStutterSource.playbackRate.setValueAtTime(1.0, audioCtx.currentTime + dosTiempos);
          currentStutterSource.playbackRate.exponentialRampToValueAtTime(0.05, audioCtx.currentTime + dosTiempos + 1.2);

        }, initialDelay);
      }
    }

    function stopStutter() {
      isStutterActive = false;

      if (stutterTimeout) {
        clearTimeout(stutterTimeout);
        stutterTimeout = null;
      }
      if (currentStutterSource) {
        try {
          currentStutterSource.stop();
          currentStutterSource.disconnect();
        } catch(e) {}
        currentStutterSource = null;
      }

      if (drumLoopGain && audioCtx && !isMuted) {
        drumLoopGain.gain.cancelScheduledValues(audioCtx.currentTime);
        drumLoopGain.gain.setValueAtTime(1.15, audioCtx.currentTime);
      }
    }

    const muteBtn = document.getElementById('muteBtn');
    const statusIndicator = document.getElementById('statusIndicator');

    muteBtn.addEventListener('click', () => {
      if (!audioCtx || !drumLoopGain) return;
      isMuted = !isMuted;

      if (isMuted) {
        drumLoopGain.gain.cancelScheduledValues(audioCtx.currentTime);
        drumLoopGain.gain.setValueAtTime(0, audioCtx.currentTime);
        muteBtn.classList.add('muted');
        muteBtn.textContent = 'UNMUTE LOOP';
        statusIndicator.style.color = '#ff0055';
        statusIndicator.textContent = 'x LOOP MUTED';
      } else {
        drumLoopGain.gain.cancelScheduledValues(audioCtx.currentTime);
        drumLoopGain.gain.setValueAtTime(1.15, audioCtx.currentTime);
        muteBtn.classList.remove('muted');
        muteBtn.textContent = 'LOOP MUTE';
        statusIndicator.style.color = '#00ff66';
        statusIndicator.textContent = '● LOOP ACTIVE';
      }
    });

    const playBtn = document.getElementById('playBtn');
    const startScreen = document.getElementById('startScreen');
    const app = document.getElementById('app');

    playBtn.addEventListener('click', async () => {
      startScreen.style.display = 'none';
      app.style.display = 'flex';
      await initSystem();
    });

    const activeTouches = new Map();

    document.querySelectorAll('.pad').forEach((pad, index) => {
      const padId = `pad_${index}`;
      const soundKey = pad.dataset.sound;
      const stutterType = pad.dataset.stutter;

      pad.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        try { pad.setPointerCapture(e.pointerId); } catch (err) {}
        pad.classList.add('active');

        activeTouches.set(e.pointerId, {
          pad,
          padId,
          soundKey,
          stutterType,
          startX: e.clientX,
          startY: e.clientY,
          isDragging: false,
          timeDown: Date.now()
        });

        if (soundKey) {
          startPadSound(padId, soundKey);
        } else if (stutterType) {
          startStutter(stutterType);
        }
      });
    });

    window.addEventListener('pointermove', (e) => {
      const touch = activeTouches.get(e.pointerId);
      if (!touch) return;

      const distance = Math.hypot(e.clientX - touch.startX, e.clientY - touch.startY);
      if (distance > 18) {
        touch.isDragging = true;
      }

      if (!touch.isDragging && (Date.now() - touch.timeDown > 120)) {
        if (touch.soundKey) {
          holdPadSound(touch.padId);
        }
      }

      const activeDraggingTouch = Array.from(activeTouches.values()).find(t => t.isDragging);
      if (activeDraggingTouch) {
        const xPercent = Math.max(0, Math.min(e.clientX / window.innerWidth, 1));
        const yPercent = Math.max(0, Math.min(e.clientY / window.innerHeight, 1));
        updateMasterXY(xPercent, yPercent);
      }
    });

    function handlePointerRelease(e) {
      const touch = activeTouches.get(e.pointerId);
      if (!touch) return;

      const { pad, padId, soundKey, stutterType } = touch;
      try { pad.releasePointerCapture(e.pointerId); } catch (err) {}
      activeTouches.delete(e.pointerId);

      const hasOtherTouchesOnPad = Array.from(activeTouches.values()).some(t => t.padId === padId);
      if (!hasOtherTouchesOnPad) {
        pad.classList.remove('active');
        if (soundKey) stopPadSound(padId);
        if (stutterType) stopStutter();
      }

      const isAnyTouchDragging = Array.from(activeTouches.values()).some(t => t.isDragging);
      if (!isAnyTouchDragging) {
        resetMasterFilter();
      }
    }

    window.addEventListener('pointerup', handlePointerRelease);
    window.addEventListener('pointercancel', handlePointerRelease);
  </script>
</body>
</html>
