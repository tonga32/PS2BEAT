<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
  <title>PS2 Jungle DrumPad</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap');

    * {
      box-sizing: border-box;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #050814;
      color: #00f0ff;
      font-family: 'Chakra Petch', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* PANTALLA DE INICIO (OVERLAY PLAY) */
    #startScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle, #101835 0%, #03050d 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      text-shadow: 0 0 10px #00f0ff;
    }

    #startScreen h1 {
      font-size: 2.2rem;
      letter-spacing: 3px;
      margin-bottom: 5px;
      color: #ffffff;
      text-transform: uppercase;
    }

    #startScreen p {
      font-size: 0.9rem;
      color: #7080b0;
      margin-bottom: 30px;
    }

    .play-btn {
      background: linear-gradient(135deg, #00f0ff, #7000ff);
      border: 2px solid #ffffff;
      border-radius: 50px;
      color: #ffffff;
      padding: 18px 45px;
      font-size: 1.5rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
      cursor: pointer;
    }

    .play-btn:active {
      transform: scale(0.95);
    }

    /* CONTENEDOR PRINCIPAL PS2 */
    #app {
      display: none;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      padding: 12px;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(180deg, #0c1026 0%, #050714 100%);
      box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.2);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(0, 240, 255, 0.05);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 6px;
    }

    .header .logo {
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 1.5px;
      color: #ffffff;
    }

    .header .status {
      font-size: 0.75rem;
      color: #00ff66;
      text-shadow: 0 0 5px #00ff66;
    }

    /* GRID DE 12 PADS (3x4) */
    .pad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 8px;
      flex-grow: 1;
      margin-top: 10px;
    }

    .pad {
      background: linear-gradient(145deg, #161d3a, #0b0f24);
      border: 1.5px solid #2a386e;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #a0b0e0;
      font-size: 0.85rem;
      font-weight: bold;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    .pad.active {
      border-color: #00f0ff;
      box-shadow: 0 0 15px #00f0ff;
      background: #1a295c;
      color: #ffffff;
    }

    /* PADS GROSS BEAT / GLITCH */
    .pad.glitch-pad {
      background: linear-gradient(145deg, #3a1628, #240b17);
      border-color: #ff0055;
      color: #ffa0c0;
    }

    .pad.glitch-pad.active {
      border-color: #ff0055;
      box-shadow: 0 0 15px #ff0055;
      background: #5c1a3a;
      color: #ffffff;
    }

    .pad span {
      pointer-events: none;
      text-transform: uppercase;
      font-size: 0.75rem;
    }

    .pad .indicator {
      position: absolute;
      bottom: 4px;
      font-size: 0.55rem;
      color: #00f0ff;
      opacity: 0.75;
    }

    .pad.glitch-pad .indicator {
      color: #ff0055;
    }
  </style>
</head>
<body>

  <!-- PANTALLA DE INICIO CON BOTÓN PLAY -->
  <div id="startScreen">
    <h1>PS2 JUNGLE PAD</h1>
    <p>TAP TO START SOUND SYSTEM</p>
    <button class="play-btn" id="playBtn">PLAY</button>
  </div>

  <!-- INTERFAZ PRINCIPAL -->
  <div id="app">
    <div class="header">
      <div class="logo">PS2 // BREAKS</div>
      <div class="status">● DRUM LOOP ACTIVE</div>
    </div>

    <div class="pad-grid">
      <!-- 9 SAMPLES PRINCIPALES (DURACIÓN: MEDIA BARRA) -->
      <div class="pad" data-sound="sample1"><span>SMP 01</span><div class="indicator">BASS (BOOST)</div></div>
      <div class="pad" data-sound="sample2"><span>SMP 02</span><div class="indicator">INSTANT</div></div>
      <div class="pad" data-sound="sample3"><span>SMP 03</span><div class="indicator">INSTANT</div></div>
      <div class="pad" data-sound="sample4"><span>SMP 04</span><div class="indicator">INSTANT</div></div>
      <div class="pad" data-sound="sample5"><span>SMP 05</span><div class="indicator">INSTANT</div></div>
      <div class="pad" data-sound="sample6"><span>SMP 06</span><div class="indicator">INSTANT</div></div>
      <div class="pad" data-sound="sample7"><span>SMP 07</span><div class="indicator">SYNCED</div></div>
      <div class="pad" data-sound="sample8"><span>SMP 08</span><div class="indicator">SYNCED</div></div>
      <div class="pad" data-sound="sample9"><span>SMP 09</span><div class="indicator">SYNCED</div></div>

      <!-- 3 PADS GROSS BEAT CORREGIDOS -->
      <div class="pad glitch-pad" data-stutter="rebreak_a"><span>RE-BREAK A</span><div class="indicator">JUNGLE CHOP</div></div>
      <div class="pad glitch-pad" data-stutter="rebreak_b"><span>RE-BREAK B</span><div class="indicator">GROSS BEAT</div></div>
      <div class="pad glitch-pad" data-stutter="scratch"><span>SLOW TAPE STOP</span><div class="indicator">VINYL BRAKE</div></div>
    </div>
  </div>

  <script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    const audioBuffers = {};
    let drumLoopSource = null;
    let drumLoopGain = null;
    let loopStartTime = 0;

    let masterGain = null;
    let masterCompressor = null;

    const soundFiles = {
      loop: './sonidos/ps2-drumbeat.mp3',
      sample1: './sonidos/sample1.mp3',
      sample2: './sonidos/sample2.mp3',
      sample3: './sonidos/sample3.mp3',
      sample4: './sonidos/sample4.mp3',
      sample5: './sonidos/sample5.mp3',
      sample6: './sonidos/sample6.mp3',
      sample7: './sonidos/sample7.mp3',
      sample8: './sonidos/sample8.mp3',
      sample9: './sonidos/sample9.mp3',
    };

    function getUnpaddedLoopPoints(buffer) {
      const channel = buffer.getChannelData(0);
      let start = 0;
      let end = buffer.duration;
      const threshold = 0.003;

      for (let i = 0; i < channel.length; i++) {
        if (Math.abs(channel[i]) > threshold) {
          start = i / buffer.sampleRate;
          break;
        }
      }
      for (let i = channel.length - 1; i >= 0; i--) {
        if (Math.abs(channel[i]) > threshold) {
          end = i / buffer.sampleRate;
          break;
        }
      }
      if (end <= start) {
        start = 0;
        end = buffer.duration;
      }
      return { start, end };
    }

    async function loadAudio(key, url) {
      try {
        const response = await fetch(url);
        const arrayBuffer = await response.arrayBuffer();
        audioBuffers[key] = await audioCtx.decodeAudioData(arrayBuffer);
      } catch (err) {
        console.error(`Error cargando ${key}:`, err);
      }
    }

    async function initSystem() {
      audioCtx = new AudioContext();

      masterCompressor = audioCtx.createDynamicsCompressor();
      masterCompressor.threshold.setValueAtTime(-10, audioCtx.currentTime);
      masterCompressor.knee.setValueAtTime(25, audioCtx.currentTime);
      masterCompressor.ratio.setValueAtTime(10, audioCtx.currentTime);
      masterCompressor.attack.setValueAtTime(0.003, audioCtx.currentTime);
      masterCompressor.release.setValueAtTime(0.2, audioCtx.currentTime);

      masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.75, audioCtx.currentTime);

      masterGain.connect(masterCompressor);
      masterCompressor.connect(audioCtx.destination);

      const promises = Object.keys(soundFiles).map(key => loadAudio(key, soundFiles[key]));
      await Promise.all(promises);

      playDrumLoop();
    }

    function playDrumLoop() {
      if (!audioBuffers['loop']) return;

      const loopBuf = audioBuffers['loop'];
      const points = getUnpaddedLoopPoints(loopBuf);

      drumLoopSource = audioCtx.createBufferSource();
      drumLoopSource.buffer = loopBuf;
      drumLoopSource.loop = true;
      drumLoopSource.loopStart = points.start;
      drumLoopSource.loopEnd = points.end;

      drumLoopGain = audioCtx.createGain();
      drumLoopGain.gain.setValueAtTime(0.85, audioCtx.currentTime);

      drumLoopSource.connect(drumLoopGain);
      drumLoopGain.connect(masterGain);

      loopStartTime = audioCtx.currentTime - points.start;
      drumLoopSource.start(0, points.start);
    }

    function getNextQuantizedTime(gridFraction = 16) {
      if (!audioBuffers['loop']) return audioCtx.currentTime;

      const loopBuf = audioBuffers['loop'];
      const points = getUnpaddedLoopPoints(loopBuf);
      const effectiveDuration = points.end - points.start;
      const stepDuration = effectiveDuration / gridFraction;

      const elapsed = audioCtx.currentTime - loopStartTime;
      const currentStep = elapsed / stepDuration;
      let nextStepIndex = Math.ceil(currentStep);

      let targetTime = loopStartTime + (nextStepIndex * stepDuration);

      if (targetTime - audioCtx.currentTime < 0.005) {
        targetTime += stepDuration;
      }

      return targetTime;
    }

    function makeDistortionCurve(amount) {
      if (amount <= 0) return null;
      const k = amount;
      const n_samples = 44100;
      const curve = new Float32Array(n_samples);
      const deg = Math.PI / 180;
      for (let i = 0; i < n_samples; ++i) {
        const x = (i * 2) / n_samples - 1;
        curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
      }
      return curve;
    }

    // -------------------------------------------------------------
    // PADS: MEDIA BARRA DE DURACIÓN + BASS SATURATOR PARA SMP 01
    // -------------------------------------------------------------
    const activePadNodes = {};

    function startPadSound(padId, soundKey) {
      if (!audioBuffers[soundKey]) return;

      stopPadSound(padId, true);

      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffers[soundKey];
      source.loop = true;

      const padGain = audioCtx.createGain();
      padGain.gain.setValueAtTime(0.8, audioCtx.currentTime);

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(20000, audioCtx.currentTime);
      filter.Q.setValueAtTime(1, audioCtx.currentTime);

      const distortion = audioCtx.createWaveShaper();

      // SATURADOR DE MEDIOS/AGUDOS EXCLUSIVO PARA SAMPLE 1 (BAJO)
      let bassBoostGain = null;
      if (soundKey === 'sample1') {
        const bassFilter = audioCtx.createBiquadFilter();
        bassFilter.type = 'peaking';
        bassFilter.frequency.setValueAtTime(1200, audioCtx.currentTime); // Realce de medios
        bassFilter.gain.setValueAtTime(12, audioCtx.currentTime);
        bassFilter.Q.setValueAtTime(1.5, audioCtx.currentTime);

        const bassDist = audioCtx.createWaveShaper();
        bassDist.curve = makeDistortionCurve(35); // Distorsión armónica suave

        source.connect(padGain);
        padGain.connect(bassFilter);
        bassFilter.connect(bassDist);
        bassDist.connect(filter);
        filter.connect(distortion);
        distortion.connect(masterGain);
      } else {
        source.connect(padGain);
        padGain.connect(filter);
        filter.connect(distortion);
        distortion.connect(masterGain);
      }

      // DETERMINAR SI LLEVA CUANTIZACIÓN
      // Samples 02, 03, 04, 05, 06 -> SIN CUANTIZAR (Disparo Instantáneo)
      // Samples 01, 07, 08, 09 -> CUANTIZADOS
      const unquantizedSamples = ['sample2', 'sample3', 'sample4', 'sample5', 'sample6'];
      const isInstant = unquantizedSamples.includes(soundKey);

      const startTime = isInstant ? audioCtx.currentTime : getNextQuantizedTime(16);

      // DURACIÓN DE MEDIA BARRA (HALF BAR)
      let halfBarDuration = 1.0;
      if (audioBuffers['loop']) {
        const loopPoints = getUnpaddedLoopPoints(audioBuffers['loop']);
        halfBarDuration = (loopPoints.end - loopPoints.start) * 0.5;
      }

      const stopTime = startTime + halfBarDuration;

      source.start(startTime);
      padGain.gain.setValueAtTime(0.8, Math.max(startTime, stopTime - 0.04));
      padGain.gain.exponentialRampToValueAtTime(0.0001, stopTime);
      source.stop(stopTime);

      const timeoutId = setTimeout(() => {
        delete activePadNodes[padId];
      }, Math.max(0, (stopTime - audioCtx.currentTime) * 1000));

      activePadNodes[padId] = { source, filter, distortion, padGain, timeoutId };
    }

    function updatePadXY(padId, xPercent, yPercent) {
      const nodes = activePadNodes[padId];
      if (!nodes) return;

      if (yPercent < 0.48) {
        nodes.filter.type = 'highpass';
        const factor = (0.48 - yPercent) / 0.48;
        const hpFreq = Math.pow(factor, 2) * 12000 + 20;
        nodes.filter.frequency.setTargetAtTime(hpFreq, audioCtx.currentTime, 0.015);
        nodes.filter.Q.setTargetAtTime(1 + factor * 5, audioCtx.currentTime, 0.015);
      } else if (yPercent > 0.52) {
        nodes.filter.type = 'lowpass';
        const factor = (yPercent - 0.52) / 0.48;
        const lpFreq = Math.pow(1 - factor, 2) * 18000 + 80;
        nodes.filter.frequency.setTargetAtTime(lpFreq, audioCtx.currentTime, 0.015);
        nodes.filter.Q.setTargetAtTime(1 + factor * 5, audioCtx.currentTime, 0.015);
      } else {
        nodes.filter.type = 'lowpass';
        nodes.filter.frequency.setTargetAtTime(20000, audioCtx.currentTime, 0.015);
        nodes.filter.Q.setTargetAtTime(1, audioCtx.currentTime, 0.015);
      }

      const distAmount = Math.pow(xPercent, 2) * 60;
      nodes.distortion.curve = makeDistortionCurve(distAmount);
    }

    function stopPadSound(padId, immediate = false) {
      if (activePadNodes[padId]) {
        const { source, timeoutId } = activePadNodes[padId];
        if (timeoutId) clearTimeout(timeoutId);

        if (immediate) {
          try {
            source.stop();
            source.disconnect();
          } catch (e) {}
          delete activePadNodes[padId];
        }
      }
    }

    function resetPadFilterToClean(padId) {
      if (activePadNodes[padId]) {
        const { filter, distortion } = activePadNodes[padId];
        try {
          filter.type = 'lowpass';
          filter.frequency.setTargetAtTime(20000, audioCtx.currentTime, 0.1);
          filter.Q.setTargetAtTime(1, audioCtx.currentTime, 0.1);
          if (distortion) distortion.curve = null;
        } catch(e) {}
      }
    }

    // -------------------------------------------------------------
    // EFECTOS GROSS BEAT RESTAURADOS SIN SILENCIAR EL LOOP
    // -------------------------------------------------------------
    let currentStutterSource = null;
    let stutterInterval = null;
    let stutterTimeout = null;

    function startStutter(type) {
      if (!drumLoopSource || !audioBuffers['loop']) return;
      stopStutter();

      // Atenúa temporalmente la batería principal
      drumLoopGain.gain.cancelScheduledValues(audioCtx.currentTime);
      drumLoopGain.gain.setValueAtTime(0, audioCtx.currentTime);

      const buffer = audioBuffers['loop'];
      const loopPoints = getUnpaddedLoopPoints(buffer);
      const effectiveDuration = loopPoints.end - loopPoints.start;

      // 1. TAPE STOP
      if (type === 'scratch') {
        const elapsed = audioCtx.currentTime - loopStartTime;
        const currentPos = loopPoints.start + (elapsed % effectiveDuration);

        currentStutterSource = audioCtx.createBufferSource();
        currentStutterSource.buffer = buffer;

        const stutterGain = audioCtx.createGain();
        stutterGain.gain.setValueAtTime(0.85, audioCtx.currentTime);

        currentStutterSource.connect(stutterGain);
        stutterGain.connect(masterGain);

        const startTime = getNextQuantizedTime(16);
        currentStutterSource.start(startTime, currentPos);

        currentStutterSource.playbackRate.setValueAtTime(1.0, startTime);
        currentStutterSource.playbackRate.exponentialRampToValueAtTime(0.01, startTime + 1.1);
        return;
      }

      // 2. PATRONES RE-BREAK A Y RE-BREAK B
      const sliceDuration = effectiveDuration / 16;
      
      const patternA = [0, 0, 4, 4, 2, 2, 6, 6, 8, 10, 12, 14, 15, 15, 14, 12];
      const patternB = [0, 2, 4, 6, 8, 8, 10, 12, 14, 14, 12, 10, 8, 6, 4, 2];

      const patternSeq = (type === 'rebreak_a') ? patternA : patternB;

      const elapsed = audioCtx.currentTime - loopStartTime;
      let stepIndex = Math.floor((elapsed % effectiveDuration) / sliceDuration) % patternSeq.length;

      function playPatternStep() {
        const sliceIndex = patternSeq[stepIndex % patternSeq.length];
        const sliceStartTime = loopPoints.start + (sliceIndex * sliceDuration);

        const sliceSource = audioCtx.createBufferSource();
        sliceSource.buffer = buffer;

        const sliceGain = audioCtx.createGain();
        sliceGain.gain.setValueAtTime(0.85, audioCtx.currentTime);

        sliceSource.connect(sliceGain);
        sliceGain.connect(masterGain);

        sliceSource.start(audioCtx.currentTime, sliceStartTime, sliceDuration * 1.05);

        currentStutterSource = sliceSource;
        stepIndex = (stepIndex + 1) % patternSeq.length;
      }

      const startTime = getNextQuantizedTime(16);
      const initialDelay = Math.max(0, (startTime - audioCtx.currentTime) * 1000);

      stutterTimeout = setTimeout(() => {
        playPatternStep();
        stutterInterval = setInterval(playPatternStep, sliceDuration * 1000);
      }, initialDelay);
    }

    function stopStutter() {
      if (stutterTimeout) {
        clearTimeout(stutterTimeout);
        stutterTimeout = null;
      }
      if (stutterInterval) {
        clearInterval(stutterInterval);
        stutterInterval = null;
      }
      if (currentStutterSource) {
        try {
          currentStutterSource.stop();
          currentStutterSource.disconnect();
        } catch(e) {}
        currentStutterSource = null;
      }
      // Restaura SIEMPRE la batería principal de inmediato
      if (drumLoopGain) {
        drumLoopGain.gain.cancelScheduledValues(audioCtx.currentTime);
        drumLoopGain.gain.setValueAtTime(0.85, audioCtx.currentTime);
      }
    }

    // EVENTOS TÁCTILES
    const playBtn = document.getElementById('playBtn');
    const startScreen = document.getElementById('startScreen');
    const app = document.getElementById('app');

    playBtn.addEventListener('click', async () => {
      startScreen.style.display = 'none';
      app.style.display = 'flex';
      await initSystem();
    });

    document.querySelectorAll('.pad').forEach((pad, index) => {
      const padId = `pad_${index}`;
      const soundKey = pad.dataset.sound;
      const stutterType = pad.dataset.stutter;

      pad.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        pad.classList.add('active');

        if (soundKey) {
          startPadSound(padId, soundKey);
        } else if (stutterType) {
          startStutter(stutterType);
        }
      });

      pad.addEventListener('pointermove', (e) => {
        if (pad.classList.contains('active') && soundKey) {
          calculateXY(e, pad, padId);
        }
      });

      const endHandler = (e) => {
        pad.classList.remove('active');
        if (soundKey) {
          resetPadFilterToClean(padId);
        }
        if (stutterType) {
          stopStutter();
        }
      };

      pad.addEventListener('pointerup', endHandler);
      pad.addEventListener('pointerleave', endHandler);
      pad.addEventListener('pointercancel', endHandler);
    });

    function calculateXY(e, padElement, padId) {
      const rect = padElement.getBoundingClientRect();
      const x = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
      const y = Math.max(0, Math.min(e.clientY - rect.top, rect.height));

      const xPercent = x / rect.width;
      const yPercent = y / rect.height;

      updatePadXY(padId, xPercent, yPercent);
    }
  </script>
</body>
</html>
